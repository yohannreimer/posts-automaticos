version: "3.7"

services:
  posts_automaticos:
    image: ghcr.io/yohannreimer/posts-automaticos:latest
    networks:
      - network_swarm_public
    environment:
      - TZ=America/Sao_Paulo
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - IG_ACCESS_TOKEN=${IG_ACCESS_TOKEN}
      - IG_USER_ID=${IG_USER_ID}
      - IMGBB_API_KEY=${IMGBB_API_KEY}
      - APP_PASSWORD=${APP_PASSWORD}
    volumes:
      - posts_data:/app/data
      - posts_output:/app/output
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.hostname == manager01
      resources:
        limits:
          cpus: "1.50"
          memory: 3072M
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_swarm_public
        - traefik.http.routers.postsauto.rule=Host(`posts.yrdnegocios.com.br`)
        - traefik.http.routers.postsauto.entrypoints=websecure
        - traefik.http.routers.postsauto.tls.certresolver=letsencryptresolver
        - traefik.http.routers.postsauto.service=postsauto
        - traefik.http.services.postsauto.loadbalancer.server.port=4173

volumes:
  posts_data:
  posts_output:

networks:
  network_swarm_public:
    external: true
